# Dependabot — Centurion monorepo. GitHub only reads this path; apps/web/ci/dependabot.yml
# is a proposal in the wrong place and never ran. Weekly, grouped minor/patch, no auto-merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly, day: monday, time: "03:00", timezone: Asia/Jakarta }
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    labels: [web, dependencies]

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule: { interval: weekly, day: monday, time: "03:15", timezone: Asia/Jakarta }
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      desktop-minor-patch:
        update-types: [minor, patch]
    labels: [desktop, dependencies]

  - package-ecosystem: cargo
    directory: /services/backend
    schedule: { interval: weekly, day: monday, time: "03:30", timezone: Asia/Jakarta }
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    labels: [backend, dependencies]

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule: { interval: weekly, day: monday, time: "03:45", timezone: Asia/Jakarta }
    open-pull-requests-limit: 5
    groups:
      tauri-minor-patch:
        update-types: [minor, patch]
    labels: [desktop, dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "04:00", timezone: Asia/Jakarta }
    labels: [ci, dependencies]
