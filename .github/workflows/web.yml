name: web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["apps/web/**", "packages/contracts/**", "packages/i18n/**", "packages/design-tokens/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["apps/web/**", "packages/contracts/**", "packages/i18n/**", "packages/design-tokens/**", ".github/workflows/web.yml"]

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: No secrets in the client bundle
        run: |
          ! grep -rEl '(sk_live|sk_test|service_role|-----BEGIN|SUPABASE_SERVICE|OWNER_WALLETS|JWT_SECRET|srt_[A-Za-z0-9]{8,})' .next/static
      - run: npm audit --audit-level=moderate
