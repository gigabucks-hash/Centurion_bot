name: web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["apps/web/**", "packages/contracts/**", "packages/i18n/**", "packages/design-tokens/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["apps/web/**", "packages/contracts/**", "packages/i18n/**", "packages/design-tokens/**", ".github/workflows/web.yml"]

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: No secrets in the client bundle
        run: |
          ! grep -rEl '(sk_live|sk_test|service_role|-----BEGIN|SUPABASE_SERVICE|OWNER_WALLETS|JWT_SECRET|srt_[A-Za-z0-9]{8,})' .next/static
      - run: npm audit --omit=dev --audit-level=moderate

  # Proves the production image builds and boots without a deploy target. No registry, no secrets.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: centurion-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot the image and probe /login
        run: |
          docker run -d --name web -p 3100:3100 centurion-web:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' web)" = "healthy" ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' web
          code=$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/login)
          echo "GET /login -> $code"
          test "$code" = "200"
          test "$(docker inspect -f '{{.State.Health.Status}}' web)" = "healthy"
      - name: Container logs on failure
        if: failure()
        run: docker logs web || true
