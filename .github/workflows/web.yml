name: web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["apps/web/**", "packages/contracts/**", "packages/i18n/**", "packages/design-tokens/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["apps/web/**", "packages/contracts/**", "packages/i18n/**", "packages/design-tokens/**", ".github/workflows/web.yml"]

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Browser for the key-flow smoke
        run: npx --yes playwright@1.65.0 install chromium --with-deps
      - name: Chart indicators, drawing, and reload
        run: |
          CENTURION_AUTH_GATE=0 npx next dev -p 3111 &
          echo $! > /tmp/centurion-chart.pid
          node scripts/chart-studio.mjs
          kill "$(cat /tmp/centurion-chart.pid)" || true
        env:
          E2E_BASE: http://127.0.0.1:3111
      - name: Login, theme, and auth-gate smoke
        run: |
          npm run start &
          echo $! > /tmp/centurion-web.pid
          node scripts/e2e-smoke.mjs
          kill "$(cat /tmp/centurion-web.pid)" || true
      - name: No secrets in the client bundle
        run: |
          ! grep -rEl '(sk_live|sk_test|service_role|-----BEGIN|SUPABASE_SERVICE|OWNER_WALLETS|JWT_SECRET|srt_[A-Za-z0-9]{8,})' .next/static
      - run: npm audit --omit=dev --audit-level=moderate

  # Proves the production image builds and boots without a deploy target. No registry, no secrets.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: centurion-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot the image and probe /login
        run: |
          docker run -d --name web -p 3100:3100 centurion-web:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' web)" = "healthy" ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' web
          code=$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/login)
          echo "GET /login -> $code"
          test "$code" = "200"
          test "$(docker inspect -f '{{.State.Health.Status}}' web)" = "healthy"
      - name: Container logs on failure
        if: failure()
        run: docker logs web || true
      - name: Save the web image
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: docker save centurion-web:ci | gzip > "$RUNNER_TEMP/centurion-web.tar.gz"
      - uses: actions/upload-artifact@v7
        if: success() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        with:
          name: centurion-trade-web
          path: ${{ runner.temp }}/centurion-web.tar.gz
          retention-days: 14
