name: secrets

# Every path, every push/PR. The scan in backend.yml only fires for services/backend/**,
# so a key committed under apps/web, apps/desktop or docs was never scanned. Keep this
# workflow path-filter free, and drop the duplicated `secrets` job from backend.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required only when the repository is owned by an organization. Empty on a personal
          # account, where the action runs without a licence.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
