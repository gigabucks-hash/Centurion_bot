name: mobile

on:
  push:
    paths: ['app/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/mobile.yml']

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: dart format (page_width 120 from analysis_options.yaml, T-16)
        run: dart format --output=none --set-exit-if-changed .
      - name: errors.json → api_errors.g.dart in sync
        run: tool/ci_check_errors.sh
      - run: flutter analyze
      - run: flutter test
