name: mobile

on:
  push:
    paths:
      - 'apps/mobile/**'
      - 'packages/contracts/errors.json'
      - 'packages/i18n/arb/**'
      - 'packages/design-tokens/tokens/app_tokens.dart'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/contracts/errors.json'
      - 'packages/i18n/arb/**'
      - 'packages/design-tokens/tokens/app_tokens.dart'
      - '.github/workflows/mobile.yml'

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: dart format (page_width 120 from analysis_options.yaml, T-16)
        run: dart format --output=none --set-exit-if-changed .
      - name: packages/contracts/errors.json → api_errors.g.dart in sync
        run: tool/ci_check_errors.sh
      - name: i18n ARB + design-token copies identical to packages/
        run: tool/ci_check_vendored.sh
      - run: flutter analyze
      - run: flutter test

  # Supply chain (MASVS-CODE-3): known-vuln scan of the resolved Dart deps.
  # PENDING BOSS REVIEW (docs/PERF_SECURITY.md §S5): non-blocking until approved;
  # then set fail-on-vuln: true and pin the reusable workflow to the full commit SHA.
  osv-scanner:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.0
    with:
      scan-args: |-
        --lockfile=apps/mobile/pubspec.lock
      fail-on-vuln: false
      upload-sarif: false

  # Release hardening + Play upload: obfuscated Android build (symbols + APK + AAB kept as artifacts).
  # The AAB is uploaded to the Google Play "internal" track as a draft release when the Play service-account
  # secret is present; otherwise the step is skipped with a warning and the AAB only lives in the artifact.
  release-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: flutter
    runs-on: ubuntu-latest
    # Signing material comes only from repository secrets (Settings → Secrets → Actions). Nothing is echoed,
    # and key.properties / *.jks are gitignored, so no secret can reach the repo. With the secrets unset the
    # build still runs (debug-signed) and the "Verify … signing" steps report it as a warning.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # Full JSON of the Play Console service account. Job-level so the step conditions below can test it;
      # the build never reads it and no step echoes it. Unset → upload is skipped, nothing fails.
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore release keystore from secrets (kept out of the repo)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: apps/mobile/android
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          {
            printf 'storeFile=upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > key.properties
          test -s upload-keystore.jks
      - name: Note when the build will fall back to the debug key
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — this APK is debug-signed and must not be distributed"
      - name: obfuscated release APK (--obfuscate --split-debug-info)
        run: tool/build_release.sh apk --target-platform android-arm64
      # Google Play only accepts an app bundle, so build it from the same sources/keystore as the APK.
      - name: obfuscated release AAB (--obfuscate --split-debug-info)
        run: tool/build_release.sh appbundle
      - name: Verify APK signing
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          build_tools="$(ls -d "$sdk_root"/build-tools/* | sort -V | tail -1)"
          certs="$("$build_tools/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)"
          echo "$certs" | head -3
          if echo "$certs" | grep -q 'CN=Android Debug'; then
            if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
              echo "::error::keystore secrets are set but the APK is still debug-signed (CN=Android Debug): check the secret names and key.properties"
              exit 1
            fi
            echo "::warning::APK is debug-signed (CN=Android Debug) because ANDROID_KEYSTORE_BASE64 is not set: not distributable"
          fi
      # apksigner only reads APKs; an .aab is a JAR signed with the v1 scheme, so verify it with keytool.
      - name: Verify AAB signing (keytool -printcert -jarfile)
        run: |
          aab=build/app/outputs/bundle/release/app-release.aab
          test -s "$aab"
          certs="$(keytool -printcert -jarfile "$aab")"
          echo "$certs" | head -3
          if echo "$certs" | grep -q 'CN=Android Debug'; then
            if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
              echo "::error::keystore secrets are set but the AAB is still debug-signed (CN=Android Debug): check the secret names and key.properties"
              exit 1
            fi
            echo "::warning::AAB is debug-signed (CN=Android Debug) because ANDROID_KEYSTORE_BASE64 is not set: not uploadable to Google Play"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-debug-symbols-${{ github.sha }}
          path: apps/mobile/build/symbols/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-apk-${{ github.sha }}
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-aab-${{ github.sha }}
          path: apps/mobile/build/app/outputs/bundle/release/*.aab
          retention-days: 14
      # Play release automation. Draft + internal track on purpose: a human still has to press "Roll out" in
      # the Play Console, so this pipeline never publishes to testers/production on its own.
      # Skipped (with a warning below) when either secret is missing — a debug-signed AAB would be rejected.
      - name: Upload AAB to Google Play (internal track, draft)
        if: env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' && env.ANDROID_KEYSTORE_BASE64 != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.centuriontrade.app
          releaseFiles: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: draft
      - name: Note when the Google Play upload is skipped (no service account)
        if: env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON == ''
        run: echo "::warning::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not set — AAB kept as the mobile-aab artifact only, nothing uploaded to Google Play"
      - name: Note when the Google Play upload is skipped (debug-signed AAB)
        if: env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' && env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "::warning::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is set but ANDROID_KEYSTORE_BASE64 is not — the AAB is debug-signed, so the Google Play upload is skipped"
