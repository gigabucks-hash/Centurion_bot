name: mobile

on:
  push:
    paths:
      - 'apps/mobile/**'
      - 'packages/contracts/errors.json'
      - 'packages/i18n/arb/**'
      - 'packages/design-tokens/tokens/app_tokens.dart'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/contracts/errors.json'
      - 'packages/i18n/arb/**'
      - 'packages/design-tokens/tokens/app_tokens.dart'
      - '.github/workflows/mobile.yml'

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: dart format (page_width 120 from analysis_options.yaml, T-16)
        run: dart format --output=none --set-exit-if-changed .
      - name: packages/contracts/errors.json → api_errors.g.dart in sync
        run: tool/ci_check_errors.sh
      - name: i18n ARB + design-token copies identical to packages/
        run: tool/ci_check_vendored.sh
      - run: flutter analyze
      - run: flutter test

  # Supply chain (MASVS-CODE-3): known-vuln scan of the resolved Dart deps.
  # PENDING BOSS REVIEW (docs/PERF_SECURITY.md §S5): non-blocking until approved;
  # then set fail-on-vuln: true and pin the reusable workflow to the full commit SHA.
  osv-scanner:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.0
    with:
      scan-args: |-
        --lockfile=apps/mobile/pubspec.lock
      fail-on-vuln: false
      upload-sarif: false

  # Release hardening check: obfuscated Android build (symbols kept as an artifact).
  release-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: obfuscated release APK (--obfuscate --split-debug-info)
        run: tool/build_release.sh apk --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-debug-symbols-${{ github.sha }}
          path: apps/mobile/build/symbols/
          retention-days: 90
