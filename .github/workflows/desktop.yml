name: desktop

on:
  push:
    branches: [main]
    tags: ["desktop-v*"]
    paths:
      - "apps/desktop/**"
      - "packages/contracts/**"
      - "packages/design-tokens/**"
      - "packages/i18n/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/contracts/**"
      - "packages/design-tokens/**"
      - "packages/i18n/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (desktop-vX.Y.Z)"
        required: true
        default: "desktop-v0.2.0"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: apps/desktop

jobs:
  # Typecheck + UI/contract tests (no Rust) — fast gate.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: version files agree (the updater compares these versions)
        run: npm run check:versions
      - name: design tokens in sync (subset from packages/design-tokens)
        run: |
          npm run sync:tokens
          git diff --exit-code -- src/design/
      - name: typecheck against committed packages/contracts (pin)
        run: npm run typecheck:pinned
      - run: npm run test:ui
      - run: npm run build

  # Rust gates (fmt, clippy, tests) — the desktop contract tests run against the committed pin.
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Tauri Linux system deps
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  # Unsigned Linux installers on main: .deb + .AppImage as release candidates.
  bundle:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, rust]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run sync:tokens
      - name: tauri build (mock backend, unsigned)
        run: npx tauri build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 30

  # Unsigned Windows installers on main: .msi (WiX) and .exe (NSIS) as release candidates.
  # The bundle config already ships windows.webviewInstallMode=downloadBootstrapper, so the
  # installer pulls WebView2 on first run instead of embedding it.
  windows-bundle:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, rust]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: npm run sync:tokens
      - name: tauri build (mock backend, unsigned)
        run: npx tauri build --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

  # Signed Windows release + latest.json for the in-app updater.
  # Trigger: push a tag `desktop-vX.Y.Z` (version must match tauri.conf.json), or run this
  # workflow manually with `tag`. The installed app reads
  #   https://github.com/gigabucks-hash/Centurion_bot/releases/latest/download/latest.json
  # and verifies the minisign signature before installing, then restarts.
  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'workflow_dispatch'
    needs: [web, rust]
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: npm run sync:tokens
      - name: release tag matches the app version
        run: node scripts/check-versions.mjs --tag "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: "Centurion Trade ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          releaseBody: "Signed Windows desktop build. The in-app updater reads latest.json from this release."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: true
          args: --bundles nsis,msi --config src-tauri/tauri.updater.conf.json
