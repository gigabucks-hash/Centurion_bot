name: desktop

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "packages/contracts/**"
      - "packages/design-tokens/**"
      - "packages/i18n/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/contracts/**"
      - "packages/design-tokens/**"
      - "packages/i18n/**"
      - ".github/workflows/desktop.yml"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: apps/desktop

jobs:
  # Typecheck + UI/contract tests (no Rust) — fast gate.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: design tokens in sync (subset from packages/design-tokens)
        run: |
          npm run sync:tokens
          git diff --exit-code -- src/design/
      - name: typecheck against committed packages/contracts (pin)
        run: npm run typecheck:pinned
      - name: ui-format / hold-reset / coin-avatar / strategy-gate tests
        run: npm run test:ui
      - name: production web build (tsc -b && vite build)
        run: npm run build

  # Rust: fmt, clippy, unit + contracts tests.
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Tauri Linux system deps
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  # Unsigned Linux installers on main: .deb + .AppImage as release candidates.
  bundle:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, rust]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run sync:tokens
      - name: tauri build (mock backend, unsigned)
        run: npx tauri build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 30
