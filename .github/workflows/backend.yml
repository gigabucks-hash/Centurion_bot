name: backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["services/backend/**", "packages/contracts/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["services/backend/**", "packages/contracts/**", ".github/workflows/backend.yml"]

defaults:
  run:
    working-directory: services/backend

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: contracts in sync (error enum codegen) + typecheck
        working-directory: packages/contracts
        run: |
          node scripts/gen-errors.mjs
          (cd ../../services/backend && cargo fmt -p common)
          git diff --exit-code -- . ../../services/backend/crates/common/src/error_codes.rs
          npm i --no-save typescript@5 && npx tsc --noEmit -p tsconfig.json
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (incl. live-execution stub so it keeps compiling)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test (default features = paper only)
        run: cargo test --workspace
      - name: guard replay latency budget
        run: cargo test -p guard --release -- --ignored replay_budget
      - name: live-execution must be off by default
        run: |
          ! cargo tree -p ingest -e features | grep -q 'live-execution'

  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: migration + smoke tests (RLS, append-only, settings CHECK, proposals)
        run: scripts/check_sql.sh

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    defaults:
      run:
        working-directory: services/backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.85
      - name: fetch deps for the logo crate (tests build it offline)
        working-directory: services/backend
        run: cargo fetch --locked
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: REST/SSE tests against Postgres (TRADING_MODE=paper only)
        run: npm test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
