[package]
name = "sentra"
version = "0.1.0"
description = "Sentra desktop trading terminal (prototype, mock data only)"
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"

[lib]
name = "sentra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros"] }
thiserror = "2"
log = "0.4"

# Planned (Week 2): OS keychain for the backend session token. Off by default in the prototype.
keyring = { version = "3", optional = true, features = ["apple-native", "windows-native", "sync-secret-service"] }

[features]
default = []
keychain = ["dep:keyring"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
