[package]
name = "centurion"
version = "0.1.0"
description = "Centurion desktop trading terminal (prototype, mock backend only)"
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"

[lib]
name = "centurion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros", "rt", "net", "io-util"] }
# OS CSPRNG for the SIWS loopback `state` (already in the dependency tree; no new download).
getrandom = "0.2"
# PKCE S256 for the centurion://auth code exchange (already in Cargo.lock / offline cache).
sha2 = "0.10"
thiserror = "2"
log = "0.4"
# Wire contract v1: decimal strings parsed for internal math/display only (never f64 on the wire).
rust_decimal = { version = "1", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Real transport (CENTURION_BACKEND): REST + SSE. rustls (no OpenSSL), no redirects, no cookies.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Planned (Week 2): OS keychain for the backend session token. Off by default in the prototype.
keyring = { version = "3", optional = true, features = ["apple-native", "windows-native", "sync-secret-service"] }

[features]
# The keychain is on by default: the SIWS session (and nothing else) is stored there.
default = ["keychain"]
keychain = ["dep:keyring"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
