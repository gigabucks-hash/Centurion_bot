analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
include: package:flutter_lints/flutter.yaml

# T-16: one line-length rule for the whole app = 120 columns.
# - `dart format` (Dart >= 3.7 reads this key) wraps code at 120;
#   CI runs `dart format --output=none --set-exit-if-changed .`.
# - `lines_longer_than_80_chars` stays OFF (it would contradict the 120 width).
# - Comments/strings the formatter cannot wrap are enforced by
#   test/line_length_test.dart (excludes generated code and vendored app_tokens.dart).
formatter:
  page_width: 120

linter:
  rules:
    prefer_const_constructors: true
    prefer_final_locals: true
    avoid_print: true
    lines_longer_than_80_chars: false
