name: centurion_mobile
description: Centurion mobile companion app (Flutter; mock data until the backend is wired).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  decimal: ^3.2.1
  flutter_riverpod: ^2.5.1
  go_router: ">=14.2.0 <18.0.0"
  google_fonts: ^9.0.0
  intl: ">=0.19.0 <1.0.0"
  # Task (e), approved by Boss 29 Okt 2026 after the code review in docs/SIWS_LOGIN_REVIEW.md §11.
  # EXACT pins; lockfile sha256 checked against /workspace/dev_team/siws_review/cr/PUB_SHA256.txt.
  pinenacl: 0.6.0
  flutter_secure_storage: 11.2.0

# Pin the reviewed federated implementations exactly (SIWS_LOGIN_REVIEW §11.2).
dependency_overrides:
  flutter_secure_storage_darwin: 0.4.3
  flutter_secure_storage_platform_interface: 2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"

flutter:
  uses-material-design: true
  generate: true
  # Static OFL fonts for google_fonts (T-17). Names must END with <Family>-<Weight>
  # (google_fonts 9 matches assets by suffix), so Google's `Inter_18pt-*.ttf` are renamed.
  # Do NOT list them under `fonts:` as well. OFL texts ship next to the files.
  assets:
    - assets/google_fonts/
  # Inter Bold (rsms/inter v4.1, OFL: assets/fonts/Inter-OFL.txt) for coin identicon initials only (COIN_LOGO §4:
  # Inter 700). From design-tokens 5594cee; sha256 pinned in tool/ci_check_vendored.sh.
  fonts:
    - family: InterIdenticon
      fonts:
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
