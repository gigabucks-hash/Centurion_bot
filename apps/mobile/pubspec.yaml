name: solbot_mobile
description: SolBot mobile companion app (prototype, mock data).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  decimal: ^3.2.1
  flutter_riverpod: ^2.5.1
  go_router: ">=14.2.0 <18.0.0"
  google_fonts: ^9.0.0
  intl: ">=0.19.0 <1.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"

flutter:
  uses-material-design: true
  generate: true
