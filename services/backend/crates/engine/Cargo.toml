[package]
name = "engine"
description = "Centurion P1 paper-only engine: supervised ingest, watchdog, Scout, Lead orchestrator, localhost view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "centurion-engine"
path = "src/main.rs"

# No new crates: everything below is already in Cargo.lock. tokio "net" is a feature of the
# existing tokio 1.54.1 (already compiled in via tokio-tungstenite), used for the localhost view.
[dependencies]
common.workspace = true
ingest = { path = "../ingest" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[dev-dependencies]
papersim.workspace = true
