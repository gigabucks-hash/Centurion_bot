[package]
name = "logo"
description = "Coin-logo transcoder: sniff, decode (PNG/JPEG/GIF first frame/WebP), bomb-guard, strip metadata, re-encode WebP/PNG at 48/64/96/128/192 px. Pure Rust, no network."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Reviewed in docs/LOGO_PROXY.md (§Dependency review). Exact pins; no default features where optional.
[dependencies]
png = { version = "=0.18.1", default-features = false }
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }
gif = { version = "=0.14.2", default-features = false, features = ["std"] }
image-webp = { version = "=0.2.4", default-features = false }

[lints]
workspace = true
