[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/screener",
    "crates/guard",
    "crates/papersim",
    "crates/db",
    "crates/ingest",
    "crates/logo",
    "crates/engine",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
base64 = "0.22"
bs58 = "0.5"
sha2 = "0.11"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"] }

common = { path = "crates/common" }
screener = { path = "crates/screener" }
guard = { path = "crates/guard" }
papersim = { path = "crates/papersim" }
db = { path = "crates/db" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
